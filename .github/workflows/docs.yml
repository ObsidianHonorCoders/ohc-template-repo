name: Deploy Documentation

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    name: Build Documentation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Doxygen
        run: sudo apt-get update && sudo apt-get install -y doxygen graphviz

      - name: Build docs
        run: |
          set -euxo pipefail
          cmake -S . -B build-docs -DBUILD_TESTING=OFF -DBUILD_DOCS=ON

          echo "---- Generated Doxyfile ----"
          grep -nE 'OUTPUT_DIRECTORY|HTML_OUTPUT|HTML_EXTRA_STYLESHEET|PROJECT_LOGO|PROJECT_ICON' build-docs/Doxyfile || true

          echo "---- Source asset check ----"
          ls -l docs/DoxyPage/custom.css docs/DoxyPage/OHC-logo-lowresolution.png || true

          echo "---- Build tree before docs ----"
          find build-docs -maxdepth 3 -type d | sort

          cmake --build build-docs --target docs

          echo "---- Generated HTML output ----"
          ls -l build-docs/html || true
          ls -l build-docs/html/custom.css build-docs/html/doxygen.css || true

          echo "---- HTML stylesheet references ----"
          grep -n 'custom.css\|doxygen.css' build-docs/html/index.html | head || true

          test -f build-docs/html/custom.css
          grep -n 'custom.css' build-docs/html/index.html >/dev/null

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build-docs/html

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
