name: CI

# Triggers: main/develop branch pushes, PRs, version tags, manual runs
on:
  push:
    branches: [main, master, develop]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# Required permissions for GitHub Actions
permissions:
  contents: read
  security-events: write
  pull-requests: write

env:
  CMAKE_VERSION: "3.28.0"

jobs:
  # ========== Pre-commit Checks (Fast, Runs First) ==========
  # Runs: clang-format, cmake-format, trailing whitespace, etc.
  # Scope: All files
  # Fail fast: Yes (blocks other jobs)
  pre-commit:
    name: Pre-commit Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install pre-commit
        run: pip install pre-commit

      - name: Run pre-commit
        run: |
          echo "Running repository hooks in GitHub Actions. This check is required for merges into main."
          pre-commit run --all-files --show-diff-on-failure || {
            echo "pre-commit failed. Fix the reported issues and push again."
            exit 1
          }

  # ========== Multi-Platform Build & Test Matrix ==========
  # Tests 5 compiler combinations across 3 platforms
  # Platforms: Linux (GCC/Clang), Windows (MSVC/MinGW), macOS
  # Each combination builds Debug and Release configs
  # Fail fast: No (continues despite failures, shows all issues)
  build-test:
    name: Build & Test (${{ matrix.os }}, ${{ matrix.compiler }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux: GCC + Clang
          - os: ubuntu-latest
            compiler: gcc
            cc: gcc
            cxx: g++
            cmake_args: "-DCMAKE_CXX_COMPILER=g++ -DCMAKE_C_COMPILER=gcc"
          - os: ubuntu-latest
            compiler: clang
            cc: clang
            cxx: clang++
            cmake_args: "-DCMAKE_CXX_COMPILER=clang++ -DCMAKE_C_COMPILER=clang"
          # Windows: MSVC + MinGW
          - os: windows-latest
            compiler: msvc
            cc: cl
            cxx: cl
            cmake_args: ""
          - os: windows-latest
            compiler: mingw
            cc: gcc
            cxx: g++
            cmake_args: '-DCMAKE_CXX_COMPILER=g++ -DCMAKE_C_COMPILER=gcc -G "MinGW Makefiles"'
          # macOS: Clang
          - os: macos-latest
            compiler: clang
            cc: clang
            cxx: clang++
            cmake_args: "-DCMAKE_CXX_COMPILER=clang++ -DCMAKE_C_COMPILER=clang"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build clang-format-15
          sudo ln -sf /usr/bin/clang-format-15 /usr/local/bin/clang-format

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew untap aws/tap 2>/dev/null || true
          brew install ninja clang-format

      - name: Configure CMake (Debug)
        run: cmake --preset dev ${{ matrix.cmake_args }}

      - name: Build (Debug)
        run: cmake --build --preset dev-build --parallel ${{ matrix.cores || 4 }}

      - name: Run Tests (Debug)
        run: ctest --preset dev-test --output-on-failure

      - name: Configure CMake (Release)
        run: cmake --preset ci ${{ matrix.cmake_args }}

      - name: Build (Release)
        run: cmake --build --preset ci-build --parallel ${{ matrix.cores || 4 }}

      - name: Run ctest (Release)
        run: ctest --preset ci-test --output-on-failure

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: build-${{ matrix.os }}-${{ matrix.compiler }}
          path: build/
          retention-days: 7

  # ========== Static Analysis with clang-tidy & cppcheck ==========
  # Detects: Memory issues, logical errors, performance problems
  # Tools: clang-tidy (clang-analyzer, bugprone, performance checks)
  #        cppcheck (general static analysis)
  # Scope: Source and header files (not tests)
  static-analysis:
    name: Static Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install clang-tidy
        run: sudo apt-get update && sudo apt-get install -y clang-tidy-15

      - name: Configure with clang-tidy
        run: |
          cmake -S . -B build-analysis \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DCMAKE_CXX_CLANG_TIDY="/usr/bin/clang-tidy-15;-checks=clang-analyzer-*,bugprone-*,performance-*;-warnings-as-errors=*;-header-filter=^.*(src|include)/.*$" \
            -DCMAKE_BUILD_TYPE=Debug \
            -DBUILD_TESTING=OFF

      - name: Build with analysis
        run: cmake --build build-analysis --parallel 4

      - name: Run cppcheck
        run: |
          sudo apt-get install -y cppcheck
          cppcheck --project=build-analysis/compile_commands.json \
            --enable=all --std=c++17 --inline-suppr \
            --suppress=missingIncludeSystem \
            --error-exitcode=1

  # ========== Code Formatting Check ==========
  # Verifies: Code style matches .clang-format rules
  # Tool: clang-format-15 (dry-run, no changes)
  # Scope: All C++ source and header files
  format-check:
    name: Format Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install clang-format
        run: sudo apt-get update && sudo apt-get install -y clang-format-15

      - name: Check formatting
        run: |
          find src include tests -name "*.cpp" -o -name "*.hpp" -o -name "*.h" | \
          xargs clang-format-15 --dry-run --Werror

  # ========== Security Scanning ==========
  # Detects: Vulnerabilities in dependencies and code
  # Tool: Trivy (container/filesystem vulnerability scanner)
  # Output: SARIF format uploaded to GitHub Security tab
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "fs"
          scan-ref: "."
          format: "sarif"
          output: "trivy-results.sarif"

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: "trivy-results.sarif"

  # ========== Documentation Build ==========
  # Generates: Doxygen API documentation from source code
  # Output: Static HTML uploaded as artifact
  # Deploy: Manual deployment to GitHub Pages via docs workflow
  docs:
    name: Build Documentation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Doxygen
        run: sudo apt-get update && sudo apt-get install -y doxygen graphviz

      - name: Build docs
        run: |
          cmake -S . -B build-docs -DBUILD_TESTING=OFF -DBUILD_DOCS=ON
          cmake --build build-docs --target docs

      - name: Upload documentation
        uses: actions/upload-artifact@v7
        with:
          name: documentation
          path: build-docs/html/
          retention-days: 30

  # ========== Release Job (Triggered on Tags) ==========
  # Condition: Only runs when git tag matches 'v*' (e.g., v1.0.0)
  # Requires: All previous jobs pass (build-test, analysis, etc.)
  # Action: Creates GitHub Release with artifacts and changelog
  # Version: Derived from git tag (v1.0.0 → 1.0.0)
  release:
    name: Create Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-test, static-analysis, format-check, security, docs]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Generate changelog
        uses: mikepenz/release-changelog-builder-action@v6
        with:
          configuration: ".github/changelog-config.json"

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            build-*/**/*.exe
            build-*/**/*.so
            build-*/**/*.dylib
          body_path: CHANGELOG.md
